<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" fill="none">
  <rect width="1920" height="1080" fill="#0E1A24" />
  <!-- Fluent clean waves with subtle blur and clean turquoise/blue tones -->
  <defs>
    <filter id="auroraBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>
  <g filter="url(#auroraBlur)" opacity="0.65">
    <ellipse cx="600" cy="900" rx="700" ry="400" fill="#0D9488" />
    <ellipse cx="1200" cy="850" rx="650" ry="450" fill="#0284C7" />
    <ellipse cx="960" cy="550" rx="800" ry="320" fill="#14B8A6" opacity="0.5" />
    <ellipse cx="1400" cy="400" rx="500" ry="300" fill="#10B981" opacity="0.35" />
  </g>
  <!-- Geometric subtle overlay -->
  <path d="M 0,650 C 400,500 800,750 1200,600 C 1600,450 1800,550 1920,500 L 1920,1080 L 0,1080 Z" fill="#0A121A" fill-opacity="0.4" />
</svg>
